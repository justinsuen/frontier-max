<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frontier Max</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">Frontier <span>Max</span></h1>
    <input id="search" class="search" type="search" placeholder="Search titles" aria-label="Search titles">
  </header>

  <main>
    <nav class="filters" aria-label="Filters">
      <div class="tabs" role="tablist">
        <button class="tab is-active" data-type="all" role="tab" aria-selected="true">All</button>
        <button class="tab" data-type="movie" role="tab" aria-selected="false">Movies</button>
        <button class="tab" data-type="series" role="tab" aria-selected="false">Series</button>
      </div>
      <div id="genres" class="genres"></div>
    </nav>

    <p id="status" class="status">Loading titles…</p>
    <ul id="grid" class="grid"></ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
